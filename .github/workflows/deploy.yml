name: Deploy

# main에 머지된(검증된) 코드만 이미지로 빌드/푸시되게 함 - CI(ci.yml)를 통과한 뒤에만 이 워크플로우가
# 도는 게 아니라 main push 자체를 트리거로 삼음. main은 PR 없이 직접 push하지 않는 걸 전제로 함.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # 배포 이력(deployment-history.jsonl)을 커밋하기 위해 필요
  packages: write # ghcr.io에 이미지를 푸시하기 위해 필요

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 버전관리 2부: latest 태그 대신 <git-sha> 기반 태그로 고정. Video_Engine은 모델 버전도 태그에 포함.
      - name: 태그/라벨에 쓸 값 준비
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "model_version=$(python3 -c "import json;print(json.load(open('Video_Engine/models/manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"
          echo "repo_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push web_server
        uses: docker/build-push-action@v5
        with:
          context: ./Web_Server
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.vars.outputs.repo_lower }}-web-server:${{ steps.vars.outputs.sha_short }}
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.sha_short }}

      - name: Build & push video_engine
        uses: docker/build-push-action@v5
        with:
          context: ./Video_Engine
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.vars.outputs.repo_lower }}-video-engine:${{ steps.vars.outputs.sha_short }}-model${{ steps.vars.outputs.model_version }}
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.sha_short }}
            MODEL_VERSION=${{ steps.vars.outputs.model_version }}

      - name: Build & push motion_engine
        uses: docker/build-push-action@v5
        with:
          context: ./Motion_Engine
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.vars.outputs.repo_lower }}-motion-engine:${{ steps.vars.outputs.sha_short }}
          build-args: |
            GIT_SHA=${{ steps.vars.outputs.sha_short }}

      # 배포 시점의 (git sha, 모델버전) 조합을 남겨서 장애 시 "그때 뭐가 돌고 있었는지" 바로 조회 가능하게
      # (scripts/show_deployment_history.py 참고)
      - name: 배포 이력 기록
        run: |
          python3 -c "
          import json, datetime
          record = {
              'ts': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'git_sha': '${{ steps.vars.outputs.sha_short }}',
              'model_version': '${{ steps.vars.outputs.model_version }}',
          }
          with open('deployment-history.jsonl', 'a') as f:
              f.write(json.dumps(record, ensure_ascii=False) + chr(10))
          "

      - name: 배포 이력 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment-history.jsonl
          git diff --cached --quiet && echo "변경 없음, 커밋 스킵" || git commit -m "chore: record deployment ${{ steps.vars.outputs.sha_short }} [skip ci]"
          git push
