services:
  web_server:
    build: ./Web_Server
    container_name: Web_Server
    ports:
      - "8000:8000"
    volumes:
      - ./Web_Server/public:/app/public
      - ./Web_Server/server.js:/app/server.js
    depends_on:
      - video_engine
      - motion_engine
    networks:
      - paintdraw_net

  video_engine:
    build: ./Video_Engine
    container_name: Video_Engine
    ports:
      - "8001:8001"
    volumes:
      - ./Video_Engine/app.py:/app/app.py
    env_file:
      - .env
    networks:
      - paintdraw_net

  motion_engine:
    build: ./Motion_Engine
    container_name: Motion_Engine
    ports:
      - "8002:8002"
    volumes:
      - ./Motion_Engine/app.py:/app/app.py
    env_file:
      - .env
    networks:
      - paintdraw_net

networks:
  paintdraw_net:
    driver: bridge
