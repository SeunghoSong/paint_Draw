<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>실시간 손동작 원격 그림판 - PC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p.sub { color: #aaa; margin-top: 0; }
    #qr-box {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin: 24px 0;
    }
    #qr-box img { display: block; width: 260px; height: 260px; }
    #status {
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      background: #333;
    }
    #status.connected {
      background: #16a34a;
    }
    #canvas-area {
      display: none;
      margin-top: 20px;
      width: 92vw;
      max-width: 1400px;
    }
    #canvas-wrap {
      position: relative;
      width: 100%;
    }
    canvas {
      background: white;
      border-radius: 8px;
      touch-action: none;
      width: 100%;
      height: auto;
      display: block;
    }
    #skeletonCanvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      background: transparent;
    }
  </style>
</head>
<body>
  <h1>🖐️ 실시간 손동작 원격 그림판</h1>
  <p class="sub">휴대폰으로 아래 QR코드를 스캔해서 연결하세요</p>

  <div id="qr-box">
    <img id="qr-img" src="" alt="QR 코드 로딩중..." />
  </div>

  <div id="status">⏳ 모바일 연결 대기중...</div>

  <div id="canvas-area">
    <div id="canvas-wrap">
      <canvas id="drawCanvas" width="1280" height="720"></canvas>
      <canvas id="skeletonCanvas" width="1280" height="720"></canvas>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let sessionId = null;

    async function init() {
      // POC 고정 세션 사용 (PM 계획서: session_id = poc-001 하드코딩)
      const configRes = await fetch('/api/config');
      const config = await configRes.json();
      sessionId = config.fixedSessionId; // 'poc-001'

      // QR도 반드시 같은 고정 세션(poc-001)을 가리키도록 생성
      // (이전 버전은 QR용으로 별도 랜덤 세션을 만들어서 PC/모바일이 서로 다른 방에 들어가는 버그가 있었음)
      try {
        const qrRes = await fetch(`/api/qr?session=${sessionId}`);
        const qrData = await qrRes.json();
        document.getElementById('qr-img').src = qrData.qrDataUrl;
        console.log('모바일 접속 URL:', qrData.mobileUrl);
      } catch (e) {
        console.error('QR 생성 실패:', e);
        document.getElementById('qr-box').innerHTML =
          `<p style="color:#333;">QR 생성 실패. 아래 주소로 직접 접속하세요:<br><b>${window.location.origin}/mobile</b></p>`;
      }

      document.getElementById('status').textContent = `⏳ 고정 세션(${sessionId})으로 모바일 연결 대기중...`;

      // 소켓으로 PC 역할로 고정 세션 방 참여
      socket.emit('join-as-pc', sessionId);
    }

    socket.on('mobile-connected', () => {
      const statusEl = document.getElementById('status');
      statusEl.textContent = '✅ 모바일 연결됨!';
      statusEl.classList.add('connected');
      document.getElementById('canvas-area').style.display = 'block';
    });

    // (다음 단계) Container C에서 오는 제어 명령 받아서 캔버스에 그리기
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';

    let lastX = null, lastY = null;
    let panOffsetX = 0, panOffsetY = 0;
    let zoomScale = 1;

    // ---------------------------
    // 손 뼈대(스켈레톤) 시각화
    // ---------------------------
    const skeletonCanvas = document.getElementById('skeletonCanvas');
    const skeletonCtx = skeletonCanvas.getContext('2d');

    // MediaPipe Hands 21개 랜드마크 표준 연결선 (관절끼리 잇는 인덱스 쌍)
    const HAND_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],       // 엄지
      [0,5],[5,6],[6,7],[7,8],       // 검지
      [5,9],[9,10],[10,11],[11,12],  // 중지
      [9,13],[13,14],[14,15],[15,16],// 약지
      [13,17],[17,18],[18,19],[19,20],// 새끼
      [0,17]                          // 손바닥 아래
    ];

    socket.on('hand-landmarks', (data) => {
      const landmarks = data.landmarks;
      skeletonCtx.clearRect(0, 0, skeletonCanvas.width, skeletonCanvas.height);
      if (!landmarks || landmarks.length < 21) return;

      // landmarks는 [[x,y], ...] 또는 [{x,y}, ...] 둘 다 올 수 있어서 통일해서 좌표 뽑기
      const pts = landmarks.map((lm) => {
        const rawX = Array.isArray(lm) ? lm[0] : lm.x;
        const rawY = Array.isArray(lm) ? lm[1] : lm.y;
        // 좌우반전 보정: 모바일 카메라가 셀카 모드(거울)라서 x를 뒤집어야 실제 손 방향과 일치함
        const mirroredX = 1 - rawX;
        return {
          x: mirroredX * skeletonCanvas.width,
          y: rawY * skeletonCanvas.height
        };
      });

      // 연결선 그리기
      skeletonCtx.strokeStyle = 'rgba(236, 72, 153, 0.85)'; // 핑크
      skeletonCtx.lineWidth = 3;
      HAND_CONNECTIONS.forEach(([a, b]) => {
        skeletonCtx.beginPath();
        skeletonCtx.moveTo(pts[a].x, pts[a].y);
        skeletonCtx.lineTo(pts[b].x, pts[b].y);
        skeletonCtx.stroke();
      });

      // 관절 점 그리기
      skeletonCtx.fillStyle = 'rgba(236, 72, 153, 0.95)';
      pts.forEach((p) => {
        skeletonCtx.beginPath();
        skeletonCtx.arc(p.x, p.y, 6, 0, Math.PI * 2);
        skeletonCtx.fill();
      });
    });

    // Motion_Engine 실제 스펙: {"action": "DRAW"|"ERASE"|"PAN"|"ZOOM_IN"|"ZOOM_OUT"|"HOVER", x, y, delta, pan_dx, pan_dy}
    socket.on('control-command', (command) => {
      const { action, x, y, delta, pan_dx, pan_dy } = command;

      if (action === 'DRAW') {
        if (lastX !== null) {
          ctx.beginPath();
          ctx.moveTo(lastX, lastY);
          ctx.lineTo(x, y);
          ctx.stroke();
        }
        lastX = x;
        lastY = y;
      } else if (action === 'ERASE') {
        ctx.clearRect(x - 20, y - 20, 40, 40);
        lastX = x;
        lastY = y;
      } else if (action === 'PAN') {
        // POC 간단 구현: 캔버스 전체를 CSS로 이동 (실제 드로잉 내용까지 옮기려면 추후 고도화 필요)
        panOffsetX += pan_dx || 0;
        panOffsetY += pan_dy || 0;
        document.getElementById('canvas-wrap').style.transform = `translate(${panOffsetX}px, ${panOffsetY}px) scale(${zoomScale})`;
        lastX = null;
        lastY = null;
      } else if (action === 'ZOOM_IN' || action === 'ZOOM_OUT') {
        zoomScale = Math.max(0.3, Math.min(3, zoomScale + (delta || 0)));
        document.getElementById('canvas-wrap').style.transform = `translate(${panOffsetX}px, ${panOffsetY}px) scale(${zoomScale})`;
        lastX = null;
        lastY = null;
      } else if (action === 'HOVER' || action === 'NONE') {
        // 대기 모드: 선이 안 이어지도록 펜 상태만 리셋
        lastX = null;
        lastY = null;
      }
    });

    init();
  </script>
</body>
</html>
